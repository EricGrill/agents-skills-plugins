name: Check diagram-design package

on:
  push:
    branches: [main]
    paths:
      - 'skills/diagram-design/**'
      - 'scripts/validate-diagram-design.mjs'
      - '.github/workflows/check-diagram-design.yml'
  pull_request:
    paths:
      - 'skills/diagram-design/**'
      - 'scripts/validate-diagram-design.mjs'
      - '.github/workflows/check-diagram-design.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate complete native package and companion resources
        run: node scripts/validate-diagram-design.mjs
